# Pushing a v* tag builds static Linux binaries and publishes a Forgejo release for that tag with them attached.
# A manual run builds the same archives and keeps them as workflow artifacts. GitHub runs
# .github/workflows/release.yml instead.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04-amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm64 }
    env:
      NAME: zenless-updater-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}-${{ matrix.target }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # A musl C compiler for aws-lc and zstd, so the binary links statically and runs on any distro.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/zenless-updater README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      # Forgejo's artifact service needs Forgejo's fork of the artifact actions.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      # Creates the release for the pushed tag and uploads everything in dist/.
      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          release-dir: dist
