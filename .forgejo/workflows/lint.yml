# Format, lint and test every push and pull request on Forgejo. GitHub runs .github/workflows/lint.yml instead;
# Forgejo ignores .github/workflows while this directory exists.
name: lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: fmt, clippy, test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # Installs rustup if the runner lacks it, then the toolchain rust-toolchain.toml pins, and caches the build.
      - uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      # Cargo.toml enables clippy::all and clippy::pedantic; -D warnings fails the job on any of them.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
