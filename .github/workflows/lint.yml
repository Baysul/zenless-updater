# Format, lint and test every push and pull request. Forgejo runs .forgejo/workflows/lint.yml instead.
name: lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt, clippy, test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain rust-toolchain.toml pins and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      # Cargo.toml enables clippy::all and clippy::pedantic; -D warnings fails the job on any of them.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
