# Pushing a v* tag builds Linux binaries and publishes a GitHub release for that tag with them attached.
# A manual run builds the same archives and keeps them as workflow artifacts. Forgejo runs
# .forgejo/workflows/release.yml instead.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, for any distro.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-26.04-arm }
          # Linked against the system's glibc, for distros with glibc 2.38 or newer.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-26.04-arm }
    env:
      NAME: zenless-updater-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      # A musl C compiler for aws-lc, zstd and mimalloc, so the musl binary links statically.
      - if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/zenless-updater README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      # Creates the release for the pushed tag (or updates it, if one exists) and uploads everything in dist/.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
