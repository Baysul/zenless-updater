[package]
name = "zenless-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A small, incremental Zenless Zone Zero updater for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
fs2 = "0.4.3"
indicatif = "0.18.6"
md5 = "0.8.1"
prost = "0.14.4"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zstd = "0.14.3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
